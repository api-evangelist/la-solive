aid: la-solive
name: La Solive
description: >-
  La Solive is a French vocational training organization (organisme de formation) preparing
  career-changers and apprentices for the trades behind building energy renovation and the
  climate transition. It runs state-recognized, practice-based programs — chef de projet en
  rénovation énergétique, conducteur de travaux, plombier chauffagiste pompe à chaleur et gaz,
  technicien de maintenance CVC, installateur de panneaux photovoltaïques, QualiPAC and
  agent de maintenance du bâtiment — delivered across campuses in Paris, Lyon, Nantes,
  Marseille, Toulouse and Lille plus a distance-learning track, with Qualiopi certification and
  France Travail / Mon Compte Formation / Transitions Pro financing. La Solive reports 1,500+
  students trained and 500+ recruiting partner companies. It is a Partech portfolio company in
  the Climate sector. As of this enrichment pass La Solive publishes no public API, developer
  portal, or /.well-known/ discovery surface; it does publish an /llms.txt agent-readable site
  index, captured in this repo.
